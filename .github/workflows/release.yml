name: Build and release binary

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      IMAGE: nonoo/yt-dlp-telegram-bot:latest
      BINARY: yt-dlp-telegram-bot-linux-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: ./docker-build.sh --target builder --build-arg GOARCH=${{ matrix.goarch }}

      - name: Extract binary from image
        run: |
          id=$(docker create "$IMAGE")
          docker cp "$id:/app/yt-dlp-telegram-bot" "$BINARY"
          docker rm "$id"
          chmod +x "$BINARY"
          sha256sum "$BINARY" > "$BINARY.sha256"
          file "$BINARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: |
            ${{ env.BINARY }}
            ${{ env.BINARY }}.sha256

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On main, derive the next version from conventional commits since the
      # last tag (fix -> patch, feat -> minor, breaking -> major). Commits that
      # are only ci/docs/chore/etc. produce no tag and no release.
      - name: Bump version and push tag
        id: tag
        if: github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false

      - name: Resolve release tag
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ steps.tag.outputs.new_tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.version.outputs.tag != ''
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
