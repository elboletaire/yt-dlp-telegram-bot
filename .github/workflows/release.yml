name: Build and release binary

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      IMAGE: nonoo/yt-dlp-telegram-bot:latest
      BINARY: yt-dlp-telegram-bot-linux-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: ./docker-build.sh --target builder --build-arg GOARCH=${{ matrix.goarch }}

      - name: Extract binary from image
        run: |
          id=$(docker create "$IMAGE")
          docker cp "$id:/app/yt-dlp-telegram-bot" "$BINARY"
          docker rm "$id"
          chmod +x "$BINARY"
          sha256sum "$BINARY" > "$BINARY.sha256"
          file "$BINARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}
          path: |
            ${{ env.BINARY }}
            ${{ env.BINARY }}.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
