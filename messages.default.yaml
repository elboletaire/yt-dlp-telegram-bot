# Default English messages. Override any key with MESSAGES_FILE.
# Values are Go text/template strings; available fields are listed per key.

getting_info: "🔍 Getting information..."
processing: "🔨 Processing"
uploading: "☁️ Uploading"
# Fields: .Position
queued: "👨‍👦‍👦 Request queued at position #{{.Position}}"
preparing_download: "🎬 Preparing download..."
# Fields: .Video, .Audio, .Convert (all may be empty)
source_codecs: "🎬 Source: {{.Video}}{{if .Audio}}{{if .Video}} / {{end}}{{.Audio}}{{else}}, no audio{{end}}{{if .Convert}} (converting: {{.Convert}}){{else}} (no conversion needed){{end}}"
# Fields: .Label
progress_unknown: "{{.Label}}... (no progress available)"
# Fields: .Label, .Info
progress_starting: "{{.Label}}...{{.Info}}"
# Fields: .Label, .Bar, .Info
progress_bar: "{{.Label}}: {{.Bar}}{{.Info}}"
message_deleted: "🗑️ Message deleted"
# Fields: .Err
error: "❌ Error: {{.Err}}"
canceled: "❌ Canceled by user"
no_active_request: "❌ Error: no active request to cancel"
invalid_command: "❌ Error: invalid command"
welcome: "🤖 Welcome! This bot downloads videos from various supported sources and then re-uploads them to Telegram, so they can be viewed with Telegram's built-in video player.\n\nMore info: https://github.com/nonoo/yt-dlp-telegram-bot"
help: "🤖 Available commands:\n\n/dlp <url> - Download the video at the given URL\n/dlp mp3 <url> - Download only the audio as a 320k MP3\n/dlpcancel - Cancel the ongoing download\n/help - Show this help\n\nYou can also just send a URL and it will be downloaded."
# Fields: .Version
bot_started: "🤖 Bot started, {{.Version}}"
# Fields: .Version
bot_updated: "🤖 Bot updated, {{.Version}}"
# Fields: .Current
ytdlp_up_to_date: "yt-dlp version: {{.Current}} (up to date)"
# Fields: .Current, .Latest
ytdlp_update_needed: "📢 yt-dlp version: {{.Current}} 📢 Update needed! Latest version is {{.Latest}} 📢"

# Likes and best-of (only used when LIKES_ENABLED=true)
# Fields: .Count
like_button: "❤️ {{.Count}}"
liked: "❤️ Liked!"
unliked: "💔 Like removed"
like_self: "You can't like your own video 😅"
interval_day: "day"
interval_week: "week"
interval_month: "month"
# Fields: .Interval, .Rank, .Likes (❤️ button), .Reactions (on the original post and the video),
# .Score (.Likes + .Reactions), .User, .Title, .Link (.Link may be empty)
best_of_caption: "🏆 Best of the {{.Interval}} #{{.Rank}} · {{if .Likes}}{{.Likes}} ❤️ · {{end}}{{if .Reactions}}{{.Reactions}} {{if eq .Reactions 1}}reaction{{else}}reactions{{end}} · {{end}}{{.User}}{{if .Link}}\n{{.Link}}{{end}}"
# Fields: .Interval, .Chat, .Err
best_of_failed: "❌ Best of the {{.Interval}} failed for chat {{.Chat}}: {{.Err}}"
